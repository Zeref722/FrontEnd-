<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO-FITT Fitness Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-image: url('https://picsum.photos/1920/1080?blur=10'); background-size: cover; background-position: center; background-attachment: fixed; color: #333; }
        .quiz-container { background-color: #fff; padding: 2rem; border-radius: 15px; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); margin-top: 5rem; max-width: 800px; width: 100%; }
        .quiz-header h1 { color: #ff7f50; font-weight: bold; }
        .quiz-header p { font-size: 1.1rem; color: #666; }
        .quiz-card { border: none; border-radius: 15px; overflow: hidden; transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .quiz-card:hover { transform: scale(1.05); }
        .quiz-card img { height: 180px; object-fit: cover; }
        .quiz-card .card-body { text-align: center; }
        .quiz-card.selected { border: 3px solid #ff7f50; box-shadow: 0 0 15px rgba(255, 127, 80, 0.5); }
        .btn-next { background-color: #ff7f50; color: #fff; font-weight: bold; border: none; }
        .btn-next:hover { background-color: #ff6338; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="quiz-container">
            <div class="quiz-header text-center mb-5">
                <h1>PRO-FITT Fitness Quiz</h1>
                <p>Discover Your Perfect Fitness Plan in Just a Few Steps!</p>
            </div>
            <h4 class="text-center mb-4" id="quizQuestion"></h4>
            <div class="row g-4" id="quizOptions"></div>
            <div class="d-flex justify-content-between align-items-center mt-4">
                <button class="btn btn-light" id="prevButton" disabled>Previous</button>
                <button class="btn btn-next" id="nextButton" disabled>Next &rarr;</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const quizData = [
                { question: "What are you most interested in?", options: [{ title: "Fitness", image: "https://picsum.photos/300/200?random=1" }, { title: "Sports", image: "https://picsum.photos/300/200?random=2" }, { title: "Diet", image: "https://picsum.photos/300/200?random=3" }] },
                { question: "What is your gender?", options: [{ title: "Male", image: "https://picsum.photos/300/200?random=4" }, { title: "Female", image: "https://picsum.photos/300/200?random=5" }, { title: "Other", image: "https://picsum.photos/300/200?random=6" }] },
                { question: "What is your primary fitness goal?", options: [{ title: "Lose Weight", image: "https://picsum.photos/300/200?random=7" }, { title: "Build Muscle", image: "https://picsum.photos/300/200?random=8" }, { title: "Improve Flexibility", image: "https://picsum.photos/300/200?random=9" }, { title: "Increase Endurance", image: "https://picsum.photos/300/200?random=10" }, { title: "Maintain Fitness", image: "https://picsum.photos/300/200?random=11" }] },
                { question: "Which type of meal do you prefer?", options: [{ title: "Vegetarian", image: "https://picsum.photos/300/200?random=12" }, { title: "Non-Vegetarian", image: "https://picsum.photos/300/200?random=13" }] },
                { question: "How would you rate your current fitness level?", options: [{ title: "Beginner", image: "https://picsum.photos/300/200?random=14" }, { title: "Intermediate", image: "https://picsum.photos/300/200?random=15" }, { title: "Pro", image: "https://picsum.photos/300/200?random=16" }] },
                { question: "How many days a week are you willing to commit to exercise?", options: [{ title: "1-2 days", image: "https://picsum.photos/300/200?random=17" }, { title: "3-4 days", image: "https://picsum.photos/300/200?random=18" }, { title: "5-6 days", image: "https://picsum.photos/300/200?random=19" }, { title: "Daily", image: "https://picsum.photos/300/200?random=20" }] },
                { question: "Please input your details.", inputFields: [{ label: "Height (in cm)", type: "number", id: "height" }, { label: "Weight (in kg)", type: "number", id: "weight" }, { label: "Age (in years)", type: "number", id: "age" }] }
            ];

            const quizQuestion = document.getElementById('quizQuestion');
            const quizOptions = document.getElementById('quizOptions');
            const nextButton = document.getElementById('nextButton');
            const prevButton = document.getElementById('prevButton');

            let currentStep = 0;
            let selectedOptions = {};

            function updateQuizContent() {
                const currentQuizData = quizData[currentStep];
                quizQuestion.textContent = currentQuizData.question;
                
                if (currentQuizData.options) {
                    quizOptions.innerHTML = currentQuizData.options.map((option, index) => `
                        <div class="col-md-${12 / currentQuizData.options.length} mb-3">
                            <div class="card quiz-card" data-option="${option.title}">
                                <img src="${option.image}" class="card-img-top" alt="${option.title}">
                                <div class="card-body">
                                    <h5 class="card-title">${option.title}</h5>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    document.querySelectorAll('.quiz-card').forEach(card => {
                        card.addEventListener('click', function() {
                            document.querySelectorAll('.quiz-card').forEach(c => c.classList.remove('selected'));
                            this.classList.add('selected');
                            selectedOptions[currentStep] = this.getAttribute('data-option');
                            nextButton.disabled = false;
                        });
                    });

                    if (selectedOptions[currentStep]) {
                        document.querySelector(`.quiz-card[data-option="${selectedOptions[currentStep]}"]`).classList.add('selected');
                    }
                } else if (currentQuizData.inputFields) {
                    quizOptions.innerHTML = currentQuizData.inputFields.map(field => `
                        <div class="mb-3">
                            <label for="${field.id}" class="form-label">${field.label}</label>
                            <input type="${field.type}" id="${field.id}" class="form-control" value="${selectedOptions[field.id] || ''}">
                        </div>
                    `).join('');
                    nextButton.disabled = false;
                }

                prevButton.disabled = currentStep === 0;
                nextButton.textContent = currentStep === quizData.length - 1 ? 'Finish' : 'Next →';
            }

            function handleNext() {
                if (currentStep < quizData.length - 1) {
                    currentStep++;
                    updateQuizContent();
                } else {
                    document.querySelectorAll('input').forEach(input => {
                        if (input.value) selectedOptions[input.id] = input.value;
                    });
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = 'Quiz.php';
                    for (const [key, value] of Object.entries(selectedOptions)) {
                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = `selectedOptions[${key}]`;
                        input.value = value;
                        form.appendChild(input);
                    }
                    document.body.appendChild(form);
                    form.submit();
                }
            }

            nextButton.addEventListener('click', handleNext);
            prevButton.addEventListener('click', () => { if (currentStep > 0) { currentStep--; updateQuizContent(); } });

            updateQuizContent();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
