<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-FITT Loading Screen</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
        }

        .loader {
            font-size: 3rem;
            font-weight: bold;
            color: #ff9500;
            animation: fadeInOut 1s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="text-center">
        <div class="loader">PRO-FITT</div>
    </div>

    <script>
        // Redirect to a specific address after 10 seconds
        setTimeout(() => {
            window.location.href = "temp.php"; 
        }, 5000);
    </script>
</body>
</html>
